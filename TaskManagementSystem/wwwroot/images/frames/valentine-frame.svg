<svg width="1080" height="1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c44569;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff758c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff4d6d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <rect width="1080" height="1080" fill="url(#bgGradient)"/>
  
  <!-- Transparent center circle for photo -->
  <circle cx="540" cy="540" r="400" fill="black" opacity="1"/>
  
  <!-- Decorative hearts around the circle -->
  <!-- Top hearts -->
  <path d="M 540,120 C 520,90 480,90 460,120 C 440,90 400,90 380,120 C 380,180 460,240 500,280 C 540,240 620,180 620,120 C 600,90 560,90 540,120 Z" 
        fill="url(#heartGradient)" opacity="0.8"/>
  
  <!-- Bottom hearts cluster -->
  <path d="M 420,900 C 410,880 390,880 380,900 C 370,880 350,880 340,900 C 340,930 380,960 400,980 C 420,960 460,930 460,900 C 450,880 430,880 420,900 Z" 
        fill="#fff" opacity="0.6"/>
  
  <path d="M 660,920 C 650,900 630,900 620,920 C 610,900 590,900 580,920 C 580,950 620,980 640,1000 C 660,980 700,950 700,920 C 690,900 670,900 660,920 Z" 
        fill="#fff" opacity="0.6"/>
  
  <!-- Left side hearts -->
  <path d="M 120,400 C 110,380 90,380 80,400 C 70,380 50,380 40,400 C 40,430 80,460 100,480 C 120,460 160,430 160,400 C 150,380 130,380 120,400 Z" 
        fill="#fff" opacity="0.5"/>
  
  <path d="M 140,600 C 130,580 110,580 100,600 C 90,580 70,580 60,600 C 60,630 100,660 120,680 C 140,660 180,630 180,600 C 170,580 150,580 140,600 Z" 
        fill="#fff" opacity="0.5"/>
  
  <!-- Right side hearts -->
  <path d="M 960,420 C 950,400 930,400 920,420 C 910,400 890,400 880,420 C 880,450 920,480 940,500 C 960,480 1000,450 1000,420 C 990,400 970,400 960,420 Z" 
        fill="#fff" opacity="0.5"/>
  
  <path d="M 940,640 C 930,620 910,620 900,640 C 890,620 870,620 860,640 C 860,670 900,700 920,720 C 940,700 980,670 980,640 C 970,620 950,620 940,640 Z" 
        fill="#fff" opacity="0.5"/>
  
  <!-- Top right logo area background -->
  <rect x="850" y="50" width="180" height="180" rx="20" fill="#fff" opacity="0.9"/>
  
  <!-- Decorative elements in logo area -->
  <text x="940" y="100" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ff4d6d" text-anchor="middle">14 February</text>
  <text x="940" y="140" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#c44569" text-anchor="middle">♥</text>
  <text x="940" y="180" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ff4d6d" text-anchor="middle">2025</text>
  
  <!-- Bottom text area with white background -->
  <rect x="240" y="820" width="600" height="180" rx="25" fill="#fff" opacity="0.95"/>
  
  <!-- Valentine's text -->
  <text x="540" y="880" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#c44569" text-anchor="middle">Happy Valentine's</text>
  <text x="540" y="940" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ff4d6d" text-anchor="middle">Day 2025</text>
  <text x="540" y="980" font-family="Arial, sans-serif" font-size="24" fill="#ff758c" text-anchor="middle">♥ Love & Romance ♥</text>
  
  <!-- Decorative rose icons -->
  <text x="200" y="920" font-family="Arial, sans-serif" font-size="60" fill="#ff4d6d">🌹</text>
  <text x="880" y="920" font-family="Arial, sans-serif" font-size="60" fill="#ff4d6d">🌹</text>
  
  <!-- Small hearts scattered -->
  <text x="300" y="200" font-family="Arial, sans-serif" font-size="30" fill="#fff" opacity="0.7">♥</text>
  <text x="780" y="250" font-family="Arial, sans-serif" font-size="25" fill="#fff" opacity="0.6">♥</text>
  <text x="250" y="750" font-family="Arial, sans-serif" font-size="28" fill="#fff" opacity="0.7">♥</text>
  <text x="820" y="800" font-family="Arial, sans-serif" font-size="26" fill="#fff" opacity="0.6">♥</text>
  <text x="180" y="300" font-family="Arial, sans-serif" font-size="22" fill="#fff" opacity="0.5">♥</text>
  <text x="900" y="350" font-family="Arial, sans-serif" font-size="24" fill="#fff" opacity="0.5">♥</text>
</svg>
