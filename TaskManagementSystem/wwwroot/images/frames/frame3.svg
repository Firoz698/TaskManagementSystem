<svg width="600" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="600" fill="transparent"/>
  
  <!-- Sleek modern frame -->
  <rect x="25" y="25" width="550" height="550" fill="none" stroke="#2C3E50" stroke-width="30" rx="0"/>
  
  <!-- Inner accent -->
  <rect x="40" y="40" width="520" height="520" fill="none" stroke="#34495E" stroke-width="2" rx="0"/>
  
  <!-- Metallic effect lines -->
  <line x1="25" y1="25" x2="575" y2="25" stroke="#7F8C8D" stroke-width="1"/>
  <line x1="25" y1="575" x2="575" y2="575" stroke="#7F8C8D" stroke-width="1"/>
  <line x1="25" y1="25" x2="25" y2="575" stroke="#7F8C8D" stroke-width="1"/>
  <line x1="575" y1="25" x2="575" y2="575" stroke="#7F8C8D" stroke-width="1"/>
</svg>
