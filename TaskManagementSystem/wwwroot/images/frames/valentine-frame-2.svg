<svg width="1080" height="1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <radialGradient id="bgRadial">
      <stop offset="0%" style="stop-color:#ff85a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d6336c;stop-opacity:1" />
    </radialGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main background -->
  <rect width="1080" height="1080" fill="url(#bgRadial)"/>
  
  <!-- Decorative pattern background -->
  <circle cx="200" cy="150" r="80" fill="#fff" opacity="0.1"/>
  <circle cx="880" cy="200" r="100" fill="#fff" opacity="0.1"/>
  <circle cx="150" cy="880" r="90" fill="#fff" opacity="0.1"/>
  <circle cx="930" cy="900" r="70" fill="#fff" opacity="0.1"/>
  
  <!-- Photo area - circular -->
  <circle cx="540" cy="520" r="380" fill="black"/>
  
  <!-- Decorative ring around photo -->
  <circle cx="540" cy="520" r="410" fill="none" stroke="#fff" stroke-width="8" opacity="0.8"/>
  <circle cx="540" cy="520" r="430" fill="none" stroke="#ffe0e9" stroke-width="4" opacity="0.6"/>
  
  <!-- Top header with logo/brand -->
  <rect x="780" y="30" width="270" height="120" rx="15" fill="#fff" opacity="0.95" filter="url(#glow)"/>
  <text x="915" y="80" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#d6336c" text-anchor="middle" font-style="italic">Valentine's</text>
  <text x="915" y="120" font-family="Georgia, serif" font-size="24" fill="#ff85a1" text-anchor="middle">Special 2025</text>
  
  <!-- Large decorative hearts -->
  <!-- Top left heart -->
  <path d="M 220,200 C 200,160 140,160 120,200 C 100,160 40,160 20,200 C 20,280 120,360 170,400 C 220,360 320,280 320,200 C 300,160 240,160 220,200 Z" 
        fill="#fff" opacity="0.3" filter="url(#glow)"/>
  
  <!-- Top right small hearts -->
  <path d="M 880,350 C 870,330 850,330 840,350 C 830,330 810,330 800,350 C 800,380 840,410 860,430 C 880,410 920,380 920,350 C 910,330 890,330 880,350 Z" 
        fill="#fff" opacity="0.4"/>
  
  <!-- Bottom decorative area -->
  <rect x="150" y="900" width="780" height="150" rx="30" fill="#fff" opacity="0.95" filter="url(#glow)"/>
  
  <!-- Valentine's Day text -->
  <text x="540" y="960" font-family="Georgia, serif" font-size="56" font-weight="bold" fill="#d6336c" text-anchor="middle">Happy Valentine's Day</text>
  <text x="540" y="1020" font-family="Arial, sans-serif" font-size="32" fill="#ff85a1" text-anchor="middle">14 February 2025</text>
  
  <!-- Heart icons -->
  <text x="80" y="980" font-family="Arial" font-size="70" fill="#d6336c">♥</text>
  <text x="970" y="980" font-family="Arial" font-size="70" fill="#d6336c">♥</text>
  
  <!-- Scattered romantic elements -->
  <text x="120" y="450" font-family="Arial" font-size="40" fill="#fff" opacity="0.6">♥</text>
  <text x="940" y="550" font-family="Arial" font-size="35" fill="#fff" opacity="0.6">♥</text>
  <text x="80" y="700" font-family="Arial" font-size="38" fill="#fff" opacity="0.5">♥</text>
  <text x="980" y="750" font-family="Arial" font-size="36" fill="#fff" opacity="0.5">♥</text>
  
  <!-- Small roses -->
  <text x="250" y="150" font-family="Arial" font-size="50" opacity="0.7">🌹</text>
  <text x="850" y="880" font-family="Arial" font-size="50" opacity="0.7">🌹</text>
  
  <!-- Cupid arrow decoration -->
  <line x1="100" y1="600" x2="200" y2="550" stroke="#fff" stroke-width="4" opacity="0.4"/>
  <polygon points="200,550 210,545 205,555" fill="#fff" opacity="0.4"/>
  
  <line x1="980" y1="420" x2="880" y2="380" stroke="#fff" stroke-width="4" opacity="0.4"/>
  <polygon points="880,380 870,375 875,385" fill="#fff" opacity="0.4"/>
  
  <!-- Date badge -->
  <circle cx="540" cy="80" r="60" fill="#fff" opacity="0.9"/>
  <text x="540" y="70" font-family="Arial" font-size="32" font-weight="bold" fill="#d6336c" text-anchor="middle">14</text>
  <text x="540" y="100" font-family="Arial" font-size="18" fill="#ff85a1" text-anchor="middle">FEB</text>
</svg>
