<svg width="1080" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="modernBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b71c1c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1b5e20;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004d40;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="photoGlow">
      <stop offset="70%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#modernBg)"/>
  
  <!-- Geometric pattern overlay -->
  <g opacity="0.08" stroke="#fff" stroke-width="2" fill="none">
    <rect x="100" y="100" width="150" height="150" rx="10"/>
    <rect x="830" y="120" width="130" height="130" rx="10"/>
    <rect x="120" y="830" width="140" height="140" rx="10"/>
    <rect x="820" y="850" width="160" height="160" rx="10"/>
    <circle cx="175" cy="540" r="60"/>
    <circle cx="905" cy="540" r="55"/>
  </g>
  
  <!-- Photo frame with modern circular design -->
  <circle cx="540" cy="500" r="430" fill="url(#photoGlow)"/>
  <circle cx="540" cy="500" r="405" fill="black"/>
  
  <!-- Triple ring border -->
  <circle cx="540" cy="500" r="435" fill="none" stroke="#dc143c" stroke-width="12" opacity="0.8"/>
  <circle cx="540" cy="500" r="420" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.9"/>
  <circle cx="540" cy="500" r="450" fill="none" stroke="#2e7d32" stroke-width="8" opacity="0.7"/>
  
  <!-- Top banner with brand -->
  <rect x="750" y="40" width="290" height="150" rx="20" fill="#ffffff" opacity="0.95"/>
  <rect x="750" y="40" width="290" height="15" rx="20" fill="#dc143c"/>
  
  <!-- Logo area text -->
  <text x="895" y="100" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1b5e20" text-anchor="middle">গণতন্ত্র</text>
  <text x="895" y="135" font-family="Arial, sans-serif" font-size="24" fill="#b71c1c" text-anchor="middle">Democracy</text>
  <text x="895" y="170" font-family="Arial, sans-serif" font-size="22" fill="#004d40" text-anchor="middle">2025</text>
  
  <!-- Left side modern ballot box -->
  <g transform="translate(30, 100)">
    <rect x="0" y="0" width="200" height="200" rx="18" fill="#ffffff" opacity="0.95"/>
    
    <!-- Stylized ballot box -->
    <rect x="30" y="60" width="140" height="110" rx="6" fill="#f5f5f5" stroke="#1b5e20" stroke-width="3"/>
    <rect x="30" y="60" width="140" height="30" fill="#b71c1c"/>
    
    <!-- National emblem modern -->
    <circle cx="100" cy="115" r="38" fill="#1b5e20"/>
    <circle cx="100" cy="115" r="28" fill="#dc143c"/>
    <path d="M 100,100 L 100,130 M 85,115 L 115,115" stroke="#fff" stroke-width="3"/>
    
    <!-- Vote slip modern design -->
    <rect x="55" y="15" width="90" height="60" fill="#ffffff" stroke="#333" stroke-width="3" rx="5"/>
    <rect x="65" y="30" width="70" height="8" fill="#1b5e20" rx="2"/>
    <rect x="65" y="45" width="50" height="6" fill="#666" rx="2"/>
    <circle cx="70" cy="55" r="8" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
    <path d="M 66,55 L 69,58 L 74,52" stroke="#fff" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Right side modern elements -->
  <g transform="translate(840, 90)">
    <rect x="0" y="0" width="210" height="210" rx="18" fill="#ffffff" opacity="0.95"/>
    
    <!-- Modern flag design -->
    <rect x="25" y="25" width="160" height="100" rx="8" fill="#1b5e20"/>
    <circle cx="80" cy="75" r="38" fill="#dc143c"/>
    
    <!-- Modern vote icon -->
    <g transform="translate(105, 140)">
      <circle cx="0" cy="0" r="45" fill="#4caf50" opacity="0.2"/>
      <text x="0" y="20" font-family="Arial" font-size="60" fill="#2e7d32" text-anchor="middle">✓</text>
    </g>
  </g>
  
  <!-- Bottom left - Modern justice -->
  <g transform="translate(40, 870)">
    <rect x="0" y="0" width="150" height="150" rx="18" fill="#b71c1c" opacity="0.95"/>
    <circle cx="75" cy="75" r="50" fill="#ffffff" opacity="0.2"/>
    <text x="75" y="105" font-family="Arial" font-size="85" fill="#ffffff" text-anchor="middle">⚖️</text>
  </g>
  
  <!-- Bottom right - Patriotic elements -->
  <g transform="translate(860, 850)">
    <!-- Flag card -->
    <rect x="0" y="0" width="170" height="110" rx="12" fill="#1b5e20"/>
    <circle cx="65" cy="55" r="40" fill="#dc143c"/>
    
    <!-- Thumbs up modern -->
    <text x="85" y="200" font-family="Arial" font-size="120">👍</text>
    
    <!-- Check circle -->
    <circle cx="95" cy="270" r="35" fill="#4caf50"/>
    <text x="95" y="285" font-family="Arial" font-size="50" fill="#fff" text-anchor="middle">✓</text>
  </g>
  
  <!-- Modern crowd representation -->
  <g opacity="0.3">
    <rect x="200" y="950" width="25" height="80" rx="12" fill="#0a3d2e"/>
    <rect x="240" y="960" width="28" height="75" rx="14" fill="#0a3d2e"/>
    <rect x="285" y="955" width="26" height="78" rx="13" fill="#0a3d2e"/>
    <rect x="330" y="965" width="25" height="72" rx="12" fill="#0a3d2e"/>
    <rect x="375" y="958" width="27" height="76" rx="13" fill="#0a3d2e"/>
    <rect x="420" y="963" width="26" height="74" rx="13" fill="#0a3d2e"/>
    <rect x="465" y="957" width="28" height="77" rx="14" fill="#0a3d2e"/>
    <rect x="510" y="966" width="25" height="73" rx="12" fill="#0a3d2e"/>
    <rect x="555" y="960" width="27" height="75" rx="13" fill="#0a3d2e"/>
    <rect x="600" y="964" width="26" height="74" rx="13" fill="#0a3d2e"/>
    <rect x="645" y="958" width="28" height="76" rx="14" fill="#0a3d2e"/>
    <rect x="690" y="962" width="25" height="75" rx="12" fill="#0a3d2e"/>
    <rect x="735" y="956" width="27" height="78" rx="13" fill="#0a3d2e"/>
    <rect x="780" y="963" width="26" height="74" rx="13" fill="#0a3d2e"/>
    <rect x="825" y="959" width="25" height="76" rx="12" fill="#0a3d2e"/>
  </g>
  
  <!-- Modern text panel -->
  <rect x="110" y="900" width="860" height="155" rx="25" fill="#ffffff" opacity="0.97"/>
  <rect x="110" y="900" width="860" height="10" rx="5" fill="#dc143c"/>
  <rect x="110" y="1045" width="860" height="10" rx="5" fill="#2e7d32"/>
  
  <!-- Main text modern typography -->
  <text x="540" y="962" font-family="Arial, sans-serif" font-size="55" font-weight="bold" fill="#b71c1c" text-anchor="middle">Be a Responsible Citizen</text>
  
  <text x="540" y="1022" font-family="Arial, sans-serif" font-size="51" font-weight="bold" fill="#1b5e20" text-anchor="middle">Vote for Democracy</text>
  
  <!-- Modern developer tag -->
  <rect x="820" y="1062" width="140" height="30" rx="15" fill="#ff6b00" opacity="0.9"/>
  <text x="890" y="1083" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">Dev by Firoz</text>
  
  <!-- Modern decorative elements -->
  <g opacity="0.6">
    <!-- Geometric shapes -->
    <circle cx="120" cy="450" r="8" fill="#ffc107"/>
    <circle cx="960" cy="480" r="9" fill="#ffc107"/>
    <circle cx="110" cy="600" r="7" fill="#fff"/>
    <circle cx="970" cy="620" r="8" fill="#fff"/>
    
    <!-- Small squares -->
    <rect x="140" y="330" width="12" height="12" fill="#4caf50" rx="2"/>
    <rect x="930" y="350" width="13" height="13" fill="#4caf50" rx="2"/>
    <rect x="150" y="680" width="11" height="11" fill="#dc143c" rx="2"/>
    <rect x="920" y="700" width="12" height="12" fill="#dc143c" rx="2"/>
  </g>
  
  <!-- Top modern badge -->
  <g transform="translate(485, 35)">
    <rect x="0" y="0" width="110" height="70" rx="12" fill="#ffffff" opacity="0.95"/>
    <rect x="0" y="0" width="110" height="8" rx="4" fill="#dc143c"/>
    <text x="55" y="40" font-family="Arial" font-size="28" font-weight="bold" fill="#1b5e20" text-anchor="middle">VOTE</text>
    <text x="55" y="62" font-family="Arial" font-size="16" fill="#b71c1c" text-anchor="middle">2025</text>
  </g>
</svg>
