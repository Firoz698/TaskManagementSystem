<svg width="600" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="600" fill="transparent"/>
  
  <!-- Ornate gold frame -->
  <rect x="10" y="10" width="580" height="580" fill="none" stroke="#DAA520" stroke-width="60" rx="15"/>
  
  <!-- Inner gold detail -->
  <rect x="55" y="55" width="490" height="490" fill="none" stroke="#FFD700" stroke-width="8" rx="8"/>
  
  <!-- Decorative circles in corners -->
  <circle cx="40" cy="40" r="20" fill="#FFA500" stroke="#DAA520" stroke-width="2"/>
  <circle cx="560" cy="40" r="20" fill="#FFA500" stroke="#DAA520" stroke-width="2"/>
  <circle cx="40" cy="560" r="20" fill="#FFA500" stroke="#DAA520" stroke-width="2"/>
  <circle cx="560" cy="560" r="20" fill="#FFA500" stroke="#DAA520" stroke-width="2"/>
  
  <!-- Mid-side decorations -->
  <circle cx="300" cy="30" r="12" fill="#FFD700"/>
  <circle cx="300" cy="570" r="12" fill="#FFD700"/>
  <circle cx="30" cy="300" r="12" fill="#FFD700"/>
  <circle cx="570" cy="300" r="12" fill="#FFD700"/>
</svg>
