<svg width="1080" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="patrioticBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d32f2f;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#006a4e;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#388e3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c62828;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffed4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#patrioticBg)"/>
  
  <!-- Decorative pattern overlay -->
  <g opacity="0.1">
    <circle cx="200" cy="200" r="120" fill="#fff"/>
    <circle cx="880" cy="180" r="100" fill="#fff"/>
    <circle cx="180" cy="900" r="110" fill="#fff"/>
    <circle cx="900" cy="880" r="130" fill="#fff"/>
  </g>
  
  <!-- Premium photo frame with golden border -->
  <circle cx="540" cy="480" r="450" fill="none" stroke="url(#goldBorder)" stroke-width="25" filter="url(#strongShadow)"/>
  <circle cx="540" cy="480" r="425" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.6"/>
  <circle cx="540" cy="480" r="410" fill="black"/>
  <circle cx="540" cy="480" r="413" fill="none" stroke="url(#goldBorder)" stroke-width="3"/>
  
  <!-- Top decorative banner -->
  <path d="M 0,0 L 1080,0 L 1080,150 Q 540,200 0,150 Z" fill="#ffffff" opacity="0.15" filter="url(#glow)"/>
  
  <!-- Top left - Detailed ballot box -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="220" height="220" rx="15" fill="#ffffff" opacity="0.97" filter="url(#strongShadow)"/>
    
    <!-- Ballot box -->
    <rect x="35" y="70" width="150" height="120" rx="5" fill="#f5f5f5" stroke="#2e7d32" stroke-width="4"/>
    <rect x="35" y="70" width="150" height="35" fill="#c62828"/>
    
    <!-- Bangladesh emblem -->
    <circle cx="110" cy="135" r="42" fill="#006a4e"/>
    <circle cx="110" cy="135" r="32" fill="#dc143c"/>
    <text x="110" y="148" font-family="Arial" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold">BD</text>
    
    <!-- Voting paper -->
    <rect x="60" y="20" width="100" height="70" fill="#ffffff" stroke="#333" stroke-width="3" rx="5"/>
    <line x1="75" y1="40" x2="140" y2="40" stroke="#333" stroke-width="3"/>
    <line x1="75" y1="55" x2="130" y2="55" stroke="#333" stroke-width="3"/>
    <line x1="75" y1="70" x2="125" y2="70" stroke="#333" stroke-width="2"/>
    <circle cx="82" cy="55" r="7" fill="#2e7d32"/>
  </g>
  
  <!-- Top right - Flag and symbols -->
  <g transform="translate(810, 70)">
    <rect x="0" y="0" width="240" height="240" rx="20" fill="#ffffff" opacity="0.97" filter="url(#strongShadow)"/>
    
    <!-- Large Bangladesh flag -->
    <rect x="40" y="30" width="160" height="105" rx="8" fill="#006a4e"/>
    <circle cx="95" cy="82" r="42" fill="#dc143c"/>
    
    <!-- Democracy text -->
    <text x="120" y="165" font-family="Arial" font-size="32" font-weight="bold" fill="#2e7d32" text-anchor="middle">2025</text>
    
    <!-- Vote check -->
    <text x="120" y="215" font-family="Arial" font-size="65" fill="#4caf50" text-anchor="middle">✓</text>
  </g>
  
  <!-- Bottom left - Justice scale -->
  <g transform="translate(35, 850)">
    <rect x="0" y="0" width="160" height="160" rx="15" fill="#c62828" opacity="0.95" filter="url(#strongShadow)"/>
    <text x="80" y="110" font-family="Arial" font-size="100" fill="#ffffff" text-anchor="middle">⚖️</text>
  </g>
  
  <!-- Bottom right - National pride elements -->
  <g transform="translate(850, 830)">
    <!-- Flag -->
    <rect x="0" y="0" width="180" height="120" rx="10" fill="#006a4e" filter="url(#strongShadow)"/>
    <circle cx="70" cy="60" r="45" fill="#dc143c"/>
    
    <!-- Thumbs up -->
    <text x="90" y="210" font-family="Arial" font-size="130" filter="url(#glow)">👍</text>
    
    <!-- Check mark with glow -->
    <text x="100" y="295" font-family="Arial" font-size="75" fill="#4caf50" filter="url(#glow)">✓</text>
  </g>
  
  <!-- Patriotic crowd silhouette -->
  <g opacity="0.4" fill="#0a3d2e">
    <ellipse cx="180" cy="950" rx="35" ry="90"/>
    <ellipse cx="240" cy="965" rx="40" ry="85"/>
    <ellipse cx="300" cy="955" rx="37" ry="88"/>
    <ellipse cx="360" cy="970" rx="35" ry="82"/>
    <ellipse cx="420" cy="958" rx="38" ry="87"/>
    <ellipse cx="480" cy="968" rx="36" ry="84"/>
    <ellipse cx="540" cy="960" rx="39" ry="89"/>
    <ellipse cx="600" cy="972" rx="37" ry="83"/>
    <ellipse cx="660" cy="963" rx="35" ry="86"/>
    <ellipse cx="720" cy="970" rx="38" ry="85"/>
    <ellipse cx="780" cy="957" rx="36" ry="88"/>
    <ellipse cx="840" cy="967" rx="37" ry="84"/>
    <ellipse cx="900" cy="962" rx="35" ry="87"/>
  </g>
  
  <!-- Premium text panel -->
  <rect x="100" y="900" width="880" height="160" rx="30" fill="#ffffff" opacity="0.98" filter="url(#strongShadow)"/>
  
  <!-- Golden top border on text panel -->
  <rect x="100" y="900" width="880" height="8" rx="4" fill="url(#goldBorder)"/>
  
  <!-- Main heading with shadow -->
  <text x="540" y="965" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#c62828" text-anchor="middle" filter="url(#glow)">Be a Responsible Citizen</text>
  
  <!-- Subheading -->
  <text x="540" y="1025" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#006a4e" text-anchor="middle" filter="url(#glow)">Vote for Democracy</text>
  
  <!-- Developer credit with icon -->
  <text x="930" y="1055" font-family="Arial, sans-serif" font-size="24" fill="#555" text-anchor="end">Dev by <tspan fill="#ff6b00" font-weight="bold">Firoz</tspan></text>
  
  <!-- Decorative elements around frame -->
  <!-- Stars -->
  <g opacity="0.7" fill="#ffc107">
    <text x="90" y="450" font-family="Arial" font-size="45">★</text>
    <text x="980" y="480" font-family="Arial" font-size="42">★</text>
    <text x="100" y="280" font-family="Arial" font-size="38">★</text>
    <text x="970" y="300" font-family="Arial" font-size="40">★</text>
    <text x="85" y="650" font-family="Arial" font-size="36">★</text>
    <text x="985" y="670" font-family="Arial" font-size="38">★</text>
  </g>
  
  <!-- White decorative dots -->
  <g opacity="0.5" fill="#ffffff">
    <circle cx="150" cy="380" r="6"/>
    <circle cx="930" cy="400" r="7"/>
    <circle cx="140" cy="550" r="5"/>
    <circle cx="940" cy="570" r="6"/>
    <circle cx="160" cy="720" r="7"/>
    <circle cx="920" cy="740" r="5"/>
  </g>
  
  <!-- National symbol patterns -->
  <g opacity="0.15" stroke="#fff" stroke-width="3" fill="none">
    <circle cx="250" cy="200" r="40"/>
    <circle cx="830" cy="350" r="35"/>
    <circle cx="220" cy="750" r="38"/>
    <circle cx="860" cy="720" r="36"/>
  </g>
  
  <!-- Top center badge -->
  <g transform="translate(490, 40)" filter="url(#strongShadow)">
    <circle cx="50" cy="50" r="55" fill="url(#goldBorder)"/>
    <circle cx="50" cy="50" r="48" fill="#ffffff"/>
    <text x="50" y="50" font-family="Arial" font-size="32" font-weight="bold" fill="#c62828" text-anchor="middle">VOTE</text>
    <text x="50" y="75" font-family="Arial" font-size="18" fill="#2e7d32" text-anchor="middle">2025</text>
  </g>
</svg>
